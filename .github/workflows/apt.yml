name: Apt based Linux
on:
  push:
    branches:
      - master
      - fluent-package-v5
      - fluent-package-v6
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  define-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set-matrix
        # See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/evaluate-expressions-in-workflows-and-actions#example-returning-a-json-object
        run: echo "matrix=$(cat apt.matrix.json | jq --compact-output)" >> $GITHUB_OUTPUT
        working-directory: .github/workflows/
  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: define-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build deb on ${{ matrix.label }}
        uses: ./.github/actions/build-deb
        with:
          rake-job: ${{ matrix.rake-job }}
          next-major: 'false'
          cache-group: v6

  build-next:
    name: Build next major
    runs-on: ubuntu-24.04
    needs: define-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build next major deb on ${{ matrix.label }}
        uses: ./.github/actions/build-deb
        with:
          rake-job: ${{ matrix.rake-job }}
          next-major: 'true'
          cache-group: v7

  check_package_size:
    name: Check Package Size
    runs-on: ubuntu-24.04
    needs: [define-matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ matrix.rake-job }}
          path: fluent-package/apt/repositories
      - name: Check Package Size
        run: |
          fluent-package/apt/pkgsize-test.sh ${{ matrix.rake-job }} amd64

  installation_test:
    name: Installation Test
    runs-on: ubuntu-24.04
    needs: [define-matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installation Test on ${{ matrix.label }}
        uses: ./.github/actions/test-on-docker
        with:
          rake-job: ${{ matrix.rake-job }}
          repository-type: apt
          test-script: install-test.sh
          test-docker-image: ${{ matrix.test-docker-image }}
  piuparts_test:
    name: Piuparts Test
    runs-on: ubuntu-24.04
    needs: [define-matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Piuparts Test on ${{ matrix.label }}
        uses: ./.github/actions/test-on-docker
        with:
          rake-job: ${{ matrix.rake-job }}
          docker-options: --privileged
          repository-type: apt
          test-docker-image: ${{ matrix.test-docker-image }}
          test-script: piuparts-test.sh
  serverspec_test:
    name: Serverspec Test
    runs-on: ubuntu-24.04
    needs: [define-matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Serverspec Test on ${{ matrix.label }}
        uses: ./.github/actions/test-on-docker
        with:
          rake-job: ${{ matrix.rake-job }}
          repository-type: apt
          test-docker-image: ${{ matrix.test-docker-image }}
          test-script: serverspec-test.sh
  binstubs_test:
    name: Binstubs Test
    runs-on: ubuntu-24.04
    needs: [define-matrix, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Binstubs Test on ${{ matrix.label }}
        uses: ./.github/actions/test-on-docker
        with:
          rake-job: ${{ matrix.rake-job }}
          repository-type: apt
          test-docker-image: ${{ matrix.test-docker-image }}
          test-script: binstubs-test.sh
  test:
    name: Test ${{ matrix.runner }} ${{ matrix.label }} ${{ matrix.test }}
    needs: [build-next, check_package_size, installation_test, piuparts_test, serverspec_test, binstubs_test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-24.04
        label:
          - Debian bookworm amd64
        test:
          - "update-without-data-lost.sh v6 v7"
          - "update-without-data-lost.sh v7 v6"
        include:
          - label: Debian bookworm amd64
            rake-job: debian-bookworm
            container-image: images:debian/12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ matrix.rake-job }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v7-packages-${{ matrix.rake-job }}
          path: v7-test
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-apt-source-${{ matrix.rake-job }}
      - name: Setup Incus
        run: ./fluent-package/test-tools/setup-incus.sh
      - name: Run Test  ${{ matrix.test }} on ${{ matrix.container-image }}
        run: fluent-package/apt/systemd-test/test.sh ${{ matrix.container-image }} ${{ matrix.test }}
      - name: Collect diagnostics
        if: always()
        run: |
          set +e -x
          sudo incus profile show default
          uname -a
          grep PRETTY_NAME /etc/os-release
          incus version || true
          docker version --format "{{.Server.Version}}" || true
          docker info 2>/dev/null | grep -iE "firewall|iptables|cgroup" || true
          sudo iptables --version || true
          sudo dmesg | grep -iE "apparmor|denied" | tail -80 || true
          sudo aa-status 2>/dev/null | head -60 || true
          sudo iptables -S | head -80 || true
          sudo nft list ruleset | head -200 || true
          ip addr show incusbr0 || true
          sudo ss -lunp | grep -E ":53 " || true
          sudo incus list || true
          sudo incus config show target --expanded || true
          sudo incus info target --show-log | tail -40 || true
          cat /sys/kernel/security/lsm; echo
          cat /proc/sys/kernel/yama/ptrace_scope || true
          sudo dmesg | grep -iE "landlock|lsm" | tail -20 || true
          sudo journalctl -k --no-pager | grep -iE "landlock" | tail -20 || true
          cat > probe.sh <<'EOF'
          ctx=$1
          echo "##### probe: $ctx"
          getent hosts deb.debian.org || echo "resolve-failed"
          echo "self userns=$(readlink /proc/self/ns/user) pidns=$(readlink /proc/self/ns/pid)"
          echo "self uid_map: $(tr -s ' ' < /proc/self/uid_map)"
          grep -E "^(Uid|CapEff|NoNewPrivs|Seccomp|Seccomp_filters)" /proc/self/status
          echo "self label: $(cat /proc/self/attr/current 2>/dev/null)"
          cat /proc/self/cgroup
          check() {
            p=$1
            r1=$(kill -0 "$p" 2>&1 && echo ok)
            r2=$(head -c1 "/proc/$p/environ" 2>&1 >/dev/null && echo ok)
            r3=$(readlink "/proc/$p/ns/user" 2>&1)
            echo "pid $p uid=$(stat -c %u /proc/$p) comm=$(cat /proc/$p/comm): kill0=[$r1] environ=[$r2] userns=[$r3]"
          }
          check 1
          for p in $(pgrep -x systemd-journal); do check "$p"; done
          for p in $(pgrep -f "bin/fluentd"); do check "$p"; done
          for p in $(pgrep -x rsyslogd); do check "$p"; echo "  label: $(cat /proc/$p/attr/current 2>&1)"; done
          EOF
          sudo incus exec target -- sh /host/probe.sh incus-exec || true
          sudo incus exec target -- systemd-run --wait --pipe --quiet sh /host/probe.sh systemd-run || true
          initpid=$(sudo incus info target | awk '/^PID:/{print $2}')
          [ -n "$initpid" ] && sudo nsenter -t "$initpid" -a sh /host/probe.sh nsenter || true
          apparmor_parser --version | head -1 || true
          cat /sys/kernel/security/apparmor/features/signal/mask; echo
          cat /sys/kernel/security/apparmor/features/ptrace/mask; echo
          sudo ls /var/lib/incus/security/apparmor/profiles/ || true
          sudo sh -c 'grep -nE "signal|ptrace|deny|^profile|change_profile|stack" /var/lib/incus/security/apparmor/profiles/incus-target*' || true
          for p in $(pgrep -f "/sbin/init|bin/fluentd|systemd-journald|rsyslogd"); do
            echo "host pid $p: $(sudo cat /proc/$p/attr/current 2>&1) :: $(tr '\0' ' ' < /proc/$p/cmdline | cut -c1-80)"
          done
          sudo incus exec target -- sleep 15 &
          sleep 3
          sp=$(pgrep -n -x sleep)
          echo "incus exec sleep host pid $sp: $(sudo cat /proc/$sp/attr/current 2>&1)"
          wait || true
          sudo lsns -t user || true
          sudo ps -eo pid,ppid,uid,userns,pidns,args --forest | grep -E "fluentd|incus|lxc|forkexec|/sbin/init|systemd$" | grep -v grep | head -80 || true

  confluent_test:
    name: Confluent Test
    runs-on: ubuntu-24.04
    needs: [define-matrix, test]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ matrix.rake-job }}
          path: fluent-package/apt/repositories
      - name: Confluent Test
        run: |
          mkdir -p .bundle
          docker run \
          --rm \
          --tty \
          --env CI=true \
          --volume ${PWD}:/fluentd:ro \
          ${{ matrix.test-docker-image }} \
          /fluentd/fluent-package/apt/confluent-test.sh

  s3_test:
    name: S3 Test (${{ matrix.label }} s3.sh
    needs: [define-matrix, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ matrix.rake-job }}
      - name: Setup Incus
        run: ./fluent-package/test-tools/setup-incus.sh
      - name: Setup localstack on host
        run: |
          docker run -d --name localstack -p 4566:4566 \
            -e AWS_ACCESS_KEY_ID=localstack-test -e AWS_SECRET_ACCESS_KEY=localstack-test -e AWS_DEFAULT_REGION=ap-northeast-1 localstack/localstack:community-archive
      - name: Copy s3.conf
        run: cp fluent-package/test-tools/s3.conf fluent-package/apt/systemd-test
      - name: Ensure localstack availability from host
        run: sleep 10 && curl http://127.0.0.1:4566/_localstack/health
      - name: Run Test ${{matrix.test}} on ${{ matrix.test-incus-image }}
        run: fluent-package/apt/systemd-test/test.sh ${{ matrix.test-incus-image }} s3.sh

  elasticsearch_test:
    name: Elasticsearch Test ${{ matrix.label }}
    needs: [define-matrix, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ matrix.rake-job }}
      - name: Setup Incus
        run: ./fluent-package/test-tools/setup-incus.sh
      - name: Setup Elasticsearch on host
        run: |
          docker run -d -p 9200:9200 -e "discovery.type=single-node" -e "xpack.security.enabled=false" docker.elastic.co/elasticsearch/elasticsearch:9.5.2
      - name: Copy elasticsearch.conf
        run: cp fluent-package/test-tools/elasticsearch.conf fluent-package/apt/systemd-test
      - name: Ensure elasticsearch availability from host
        run: |
          until curl --silent "http://localhost:9200/_cluster/health" | jq --raw-output ".status // empty" | grep -E "yellow|green"; do
            sleep 5
          done
          curl --silent "http://localhost:9200/_cat/indices?v"
      - name: Run Test elasticsearch.sh on ${{ matrix.test-incus-image }}
        run: fluent-package/apt/systemd-test/test.sh ${{ matrix.test-incus-image }} elasticsearch.sh

  opensearch_test:
    name: Opensearch Test ${{ matrix.label }}
    needs: [define-matrix, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-${{ matrix.rake-job }}
      - name: Setup Incus
        run: ./fluent-package/test-tools/setup-incus.sh
      - name: Setup Opensearch on host
        run: |
          docker run -d -p 9200:9200 -p 9600:9600 \
            -e "discovery.type=single-node" -e OPENSEARCH_INITIAL_ADMIN_PASSWORD=Passvv0rd@ opensearchproject/opensearch:3
      - name: Copy opensearch.conf
        run: cp fluent-package/test-tools/opensearch.conf fluent-package/apt/systemd-test
      - name: Ensure Opensearch availability from host
        run: |
          until curl --silent --insecure --user "admin:Passvv0rd@" \
                "https://localhost:9200/_cluster/health" | jq --raw-output ".status // empty" | grep -E "yellow|green"; do
            sleep 5
          done
          curl --silent --insecure --user "admin:Passvv0rd@" "https://localhost:9200/_cat/indices?v"
      - name: Run Test opensearch.sh on ${{ matrix.test-incus-image }}
        run: fluent-package/apt/systemd-test/test.sh ${{ matrix.test-incus-image }} opensearch.sh
