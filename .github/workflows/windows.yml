name: Windows
on:
  push:
    branches:
      - master
      - fluent-package-v5
      - fluent-package-v6
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    timeout-minutes: 90
    strategy:
      fail-fast: false
    runs-on: windows-2022
    steps:
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cache msi
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-msi
        with:
          path: fluent-package/msi/repositories
          key: ${{ runner.os }}-cache-windows-${{ hashFiles('**/config.rb', '**/Rakefile', '**/Gemfile*', 'fluent-package/msi/assets/*', 'fluent-package/msi/source.wxs', 'fluent-package/msi/parameters.wxi.erb', 'fluent-package/msi/localization-en-us.wxl', 'fluent-package/msi/exclude-files.xslt', 'fluent-package/msi/Dockerfile') }}
      - name: Ensure availability of Docker
        shell: pwsh
        run: |
          Start-Service docker
          1..3 | ForEach-Object {
            try {
              docker version
              Write-Host "Docker is ready"
              exit 0
            } catch {
              Write-Host "Waiting for Docker..."
              Start-Sleep -Seconds 10
            }
          }
      # Building the image from scratch costs more than 10 minutes, most of it
      # chocolatey installing a toolchain that only changes when the Dockerfile
      # changes. Reuse the image published by the "Windows build image"
      # workflow. When it is not available, for example on a pull request that
      # edits the Dockerfile, leave MSI_BUILD_IMAGE empty so that rake falls
      # back to building the image locally.
      - name: Log in to GitHub Container Registry
        if: ${{ ! steps.cache-msi.outputs.cache-hit && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $env:TOKEN | docker login ghcr.io --username ${{ github.actor }} --password-stdin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pull prebuilt build image
        id: prebuilt-image
        if: ${{ ! steps.cache-msi.outputs.cache-hit }}
        shell: pwsh
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/fluent-package-windows-x64
          TAG: ${{ hashFiles('fluent-package/msi/Dockerfile') }}
        run: |
          docker pull "${env:IMAGE}:${env:TAG}"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::${env:IMAGE}:${env:TAG} is not available, building the image locally instead"
            exit 0
          }
          "image=${env:IMAGE}:${env:TAG}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build
        if: ${{ ! steps.cache-msi.outputs.cache-hit }}
        env:
          MSI_BUILD_IMAGE: ${{ steps.prebuilt-image.outputs.image }}
        run: |
          gem install serverspec
          gem install bundler:2.2.9 --no-document
          rake msi:build
      - name: Upload td-agent msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-windows-x86_64
          path: fluent-package/msi/repositories
  check_package_size:
    name: Check Package Size
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-windows-x86_64
          path: fluent-package/msi/repositories
      - name: Check Package Size
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -Command ".\fluent-package\msi\pkgsize-test.ps1"
  test:
    name: Test ${{ matrix.test }}
    needs: build
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        test:
          - "install-test.ps1"
          - "install-test-with-install-path-including-space.ps1"
          - "update-from-v4-test.ps1"
          - "update-from-v4-test.ps1 -ViaV5"
          - "update-from-v5-test.ps1"
          - "serverspec-test.ps1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages-windows-x86_64
          path: fluent-package/msi/repositories
      - name: Ensure availability of Docker
        shell: pwsh
        run: |
          Start-Service docker
          1..3 | ForEach-Object {
            try {
              docker version
              Write-Host "Docker is ready"
              exit 0
            } catch {
              Write-Host "Waiting for Docker..."
              Start-Sleep -Seconds 10
            }
          }
      - name: Installation Test
        shell: pwsh
        run: |
          mkdir -p .bundle
          docker run `
          --rm `
          --tty `
          --volume ${PWD}:C:\fluentd:ro `
          mcr.microsoft.com/dotnet/framework/runtime:3.5 `
          powershell -ExecutionPolicy Bypass -Command "C:\fluentd\fluent-package\msi\${{ matrix.test }}"
